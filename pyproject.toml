[project]
name = "benchnuke"
version = "0.1.0"
description = "Harbor-task verifier auditor: find official-grader counterexamples."
readme = "README.md"
authors = [
    { name = "Harish", email = "harish3304.work@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "rich>=15.0.0",
    "typer>=0.15",
]

[project.scripts]
benchnuke = "benchnuke.cli:app"
bn = "benchnuke.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "integration: Harbor/Docker mechanical runs",
    "live: spawns grok -p",
]
addopts = [
    "--strict-markers",
    "-q",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.coverage.run]
source = ["benchnuke"]
omit = ["src/benchnuke/cli.py"]
